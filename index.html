<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6efff" id="tc">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="موبایل علی">
<title>تعمیرات موبایل علی</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0a84ff;--blue-d:#0062d1;--ink:#12203f;--mute:#5b6a8c;
  --glass:rgba(255,255,255,.62);--glass-hi:rgba(255,255,255,.86);--edge:rgba(255,255,255,.85);
  --hair:rgba(40,70,140,.16);--fill:rgba(90,120,190,.12);--seg-on:#fff;
  --wait:#b45f06;--ready:#1d8348;--done:#6c7280;--bad:#c0281d;--wa:#0b6b32;
  --pop:#f7faff;--b1:#a9cdff;--b2:#d4e3ff;--b3:#bddaff;--bg:#e6efff;--shadow:rgba(30,80,170,.13)
}
html[data-theme="dark"]{
  --blue-d:#6db0ff;--ink:#eaf0ff;--mute:#a0abc9;
  --glass:rgba(28,38,70,.6);--glass-hi:rgba(38,50,88,.9);--edge:rgba(255,255,255,.13);
  --hair:rgba(255,255,255,.14);--fill:rgba(255,255,255,.1);--seg-on:#3f5388;
  --wait:#ffb340;--ready:#4cd37b;--done:#a3a9b8;--bad:#ff7a70;--wa:#5be08a;
  --pop:#1b2547;--b1:#15327a;--b2:#1b2a5e;--b3:#0f3a6e;--bg:#0b1226;--shadow:rgba(0,0,0,.4)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg);color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--ink);font:400 16px/1.7 Vazirmatn,system-ui,-apple-system,Tahoma,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(112px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(60% 40% at 15% 0%,var(--b1) 0,transparent 70%),
    radial-gradient(50% 40% at 100% 30%,var(--b2) 0,transparent 70%),
    radial-gradient(60% 45% at 20% 100%,var(--b3) 0,transparent 70%),var(--bg)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--edge);box-shadow:0 10px 30px var(--shadow),inset 0 1px 0 rgba(255,255,255,.2)}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.amt{transition:filter .2s}
.hide .amt{filter:blur(7px);user-select:none}

/* بالای صفحه */
.top{position:relative;max-width:640px;margin:0 auto;padding:16px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{flex:none;width:50px;height:50px;border-radius:50%;object-fit:cover;box-shadow:0 5px 16px rgba(59,36,22,.35),0 0 0 2px rgba(255,255,255,.6)}
.brand>div{min-width:0}.brand h1{margin:0;font-size:.95rem;line-height:1.35;font-weight:800}
.brand p{margin:0;color:var(--mute);font-size:.82rem}
.hbtns{display:flex;gap:6px;align-items:center;flex:none}
.hbtns .rb{width:40px;height:40px}
.hbtns .bdot{top:7px;right:8px}
.rb{position:relative;width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;color:var(--blue-d);
  background:var(--glass-hi);border:1px solid var(--edge);box-shadow:0 6px 16px var(--shadow)}
#net{background:rgba(255,159,10,.2);color:var(--wait);font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px}

main{max-width:640px;margin:0 auto;padding:8px 16px 0}
h2.sec{margin:22px 4px 10px;font-size:1.1rem;font-weight:800;display:flex;justify-content:space-between;align-items:center}
h2.sec button{font-size:.82rem;color:var(--blue-d);padding:2px 6px;border-radius:8px;display:flex;align-items:center;gap:2px}
h2.sec button .ic{width:16px;height:16px}

/* هشدارها */
#alerts:empty{display:none}
#alerts{display:grid;gap:8px;margin-bottom:12px}
.alert{border-radius:18px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:.88rem;border-right:5px solid var(--blue)}
.alert.bad{border-right-color:var(--bad)}
.alert.warn{border-right-color:var(--wait)}
.alert span{flex:1}
.alert button{flex:none;padding:5px 12px;font-size:.8rem;border-radius:999px;background:rgba(10,132,255,.15);color:var(--blue-d)}

/* کارت آبی */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:18px 16px 16px;color:#fff;
  background:linear-gradient(155deg,#0a3593 0%,#0a5fde 55%,#2f90ff 100%);
  box-shadow:0 18px 40px rgba(10,80,200,.38),inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;left:-20%;right:-20%;bottom:-38%;height:70%;border-radius:50%;
  background:radial-gradient(60% 100% at 35% 0,rgba(255,255,255,.2),transparent 72%)}
.hero>*{position:relative}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hlbl{font-size:.9rem;opacity:.9}
.hpill{font-size:.8rem;font-weight:600;padding:3px 14px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3)}
.hbig{margin:6px 0 2px;display:flex;align-items:baseline;gap:8px}
.hbig .amt{font-size:2.15rem;font-weight:800;line-height:1.4}
.hbig small{font-size:1rem;opacity:.9}
.howe{display:inline-block;margin:4px 0 14px;font-size:.82rem;padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28)}
.howe b{font-weight:800}
.hmini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{border-radius:18px;padding:9px 4px 8px;text-align:center;color:#fff;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.3)}
.mt b{display:block;font-size:1.35rem;font-weight:800;line-height:1.5}
.mt small{font-size:.74rem;opacity:.9;display:flex;align-items:center;justify-content:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.d-o{background:#ffb340}.d-g{background:#4cd37b}.d-r{background:#ff6b61}

/* کاشی‌ها */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.tile{border-radius:22px;padding:12px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);font-size:.78rem;font-weight:600;line-height:1.5}
.tile .ib{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;margin-bottom:2px}
.tile small{font-size:.7rem;font-weight:600}
.c-green{background:rgba(48,181,101,.17);color:#1d9a52}.s-green{color:#1d9a52}
.c-blue{background:rgba(10,132,255,.16);color:#0a6fe0}.s-blue{color:#0a6fe0}
.c-teal{background:rgba(0,190,170,.16);color:#00998a}.s-teal{color:#00998a}
.c-red{background:rgba(255,69,58,.15);color:#d93a30}.s-red{color:#d93a30}
.c-orange{background:rgba(255,159,10,.18);color:#c27803}.s-orange{color:#c27803}
.c-purple{background:rgba(120,100,255,.16);color:#5b4fe0}.s-purple{color:#5b4fe0}
html[data-theme="dark"] .c-green,html[data-theme="dark"] .s-green{color:#5be08a}
html[data-theme="dark"] .c-blue,html[data-theme="dark"] .s-blue{color:#6db0ff}
html[data-theme="dark"] .c-teal,html[data-theme="dark"] .s-teal{color:#4fe0cf}
html[data-theme="dark"] .c-red,html[data-theme="dark"] .s-red{color:#ff8a80}
html[data-theme="dark"] .c-orange,html[data-theme="dark"] .s-orange{color:#ffc266}
html[data-theme="dark"] .c-purple,html[data-theme="dark"] .s-purple{color:#a89bff}

/* تحویل‌های نزدیک */
.up{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;margin-bottom:10px;width:100%;text-align:right;color:var(--ink)}
.up .tx{flex:1;min-width:0}
.up b{display:block;font-size:.98rem}
.up small{color:var(--mute);font-size:.8rem}
.chipd{flex:none;font-size:.74rem;font-weight:600;padding:2px 10px;border-radius:999px;background:rgba(255,159,10,.2);color:var(--wait)}
.chipd.bad{background:rgba(255,69,58,.16);color:var(--bad)}
.chipd.ok{background:rgba(48,209,88,.2);color:var(--ready)}

/* فرم‌ها */
label,.lbl{display:grid;gap:5px;font-weight:600;font-size:.85rem;color:var(--mute)}
textarea{resize:none}
input,select,textarea{font:inherit;color:var(--ink);padding:11px 13px;border:0;border-radius:14px;background:var(--fill);width:100%;font-size:16px}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.7}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:0;background:var(--glass-hi)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid rgba(10,132,255,.55);outline-offset:2px}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:14px;padding:12px 16px;transition:transform .12s,background .2s;color:var(--ink);background:transparent}
button:active{transform:scale(.97)}
.save{background:linear-gradient(180deg,#2f95ff,#0a76f5);color:#fff;box-shadow:0 8px 18px rgba(10,132,255,.35)}
.cancel{background:var(--fill);color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.date3{display:grid;grid-template-columns:.9fr 1.4fr 1.1fr;gap:6px}
.date3 select{padding:11px 6px}
form{display:grid;gap:12px}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qc{padding:5px 12px;font-size:.8rem;border-radius:999px;background:var(--fill);color:var(--ink);border:1px solid transparent}
.qc.on{background:rgba(10,132,255,.18);color:var(--blue-d);border-color:rgba(10,132,255,.45)}

/* لیست مشتری */
.bar{display:flex;gap:10px;margin:14px 0 10px;align-items:center}
.bar input{flex:1;border-radius:999px;padding-inline:16px;background:var(--glass-hi)}
.chips{display:flex;gap:2px;padding:3px;border-radius:14px;margin:0 0 12px;overflow-x:auto}
.chip{flex:1 0 auto;white-space:nowrap;color:var(--ink);padding:6px 7px;font-size:.76rem;border-radius:11px;font-weight:600}
.chip.on{background:var(--seg-on);box-shadow:0 2px 8px rgba(0,0,0,.18);color:var(--blue-d)}
.total{color:var(--mute);font-size:.85rem;margin:0 4px 10px}
.item{border-radius:22px;padding:14px 16px;margin-bottom:12px}
.top2{display:flex;justify-content:space-between;gap:8px;align-items:center}
.name{font-weight:800;font-size:1.02rem}
.date{color:var(--mute);font-size:.78rem;flex:none}
.pill{display:inline-block;font-size:.74rem;font-weight:600;padding:1px 10px;border-radius:999px;margin:4px 0 2px}
.p-wait{background:rgba(255,159,10,.2);color:var(--wait)}
.p-ready{background:rgba(48,209,88,.22);color:var(--ready)}
.p-done{background:rgba(142,142,147,.22);color:var(--done)}
.meta{color:var(--mute);font-size:.9rem;margin:2px 0}
.late{color:var(--bad);font-weight:600}
.owe{color:var(--bad);font-weight:600}
.paid{color:var(--ready);font-weight:600}
.body{display:flex;gap:12px;align-items:flex-start}
.body .txt{flex:1;min-width:0}
.thumb{flex:none;width:64px;height:64px;border-radius:14px;object-fit:cover;border:1px solid var(--edge);cursor:pointer;background:var(--fill)}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.acts select{width:auto;padding:6px 10px;font-size:.85rem;border-radius:999px;font-weight:600}
.acts a,.acts button{padding:6px 14px;font-size:.84rem;border-radius:999px;text-decoration:none;background:rgba(10,132,255,.14);color:var(--blue-d);font-weight:600}
.acts .wa{background:rgba(48,209,88,.22);color:var(--wa)}
.acts .pay{background:rgba(255,159,10,.2);color:var(--wait)}
.acts .del{background:rgba(255,69,58,.15);color:var(--bad)}
.empty{text-align:center;color:var(--mute);padding:30px 8px}

/* گزارش */
.card{border-radius:22px;padding:6px 16px;margin-bottom:12px}
.mon{padding:10px 0;border-bottom:1px solid var(--hair)}
.mon:last-child{border-bottom:0}
.mon .t{font-weight:800}
.rep{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem}
.rep.net strong{color:var(--ready)}
.rep.net strong.neg{color:var(--bad)}
.drow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:right;padding:10px 0;border-bottom:1px solid var(--hair);color:var(--ink);border-radius:0}
.drow:last-child{border-bottom:0}
.drow small{display:block;color:var(--mute);font-size:.8rem}
.drow strong{color:var(--bad);flex:none}
.sumline{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;font-weight:600}
.sumline strong{color:var(--bad);font-size:1.1rem}

/* تنظیمات */
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 14px;border-radius:20px;margin-bottom:10px;color:var(--ink)}
.srow .ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.srow .tx{flex:1;min-width:0}
.srow b{display:block;font-size:.95rem}
.srow small{color:var(--mute);font-size:.78rem}

/* منوی پایین */
.nav{position:fixed;z-index:10;left:12px;right:12px;max-width:616px;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom));
  border-radius:30px;padding:8px 8px;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:end;box-shadow:0 14px 36px var(--shadow),inset 0 1px 0 rgba(255,255,255,.25)}
.nb{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;font-size:.7rem;font-weight:600;color:var(--mute);border-radius:20px}
.nb.on{color:var(--blue-d);background:rgba(10,132,255,.14)}
.plus{width:58px;height:58px;border-radius:50%;padding:0;margin:-30px auto 2px;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 35% 25%,#6cb8ff,#0a76f5 60%,#0654c9);box-shadow:0 10px 24px rgba(10,110,245,.5),0 0 0 5px var(--glass-hi)}
.plus .ic{width:28px;height:28px;stroke-width:2.4}


/* تأیید مشتری */
.okrow{display:grid;gap:8px;padding:12px;border-radius:16px;background:var(--fill)}
.chk{display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:600;color:var(--ink);cursor:pointer}
.chk input{width:24px;height:24px;padding:0;flex:none;accent-color:var(--blue)}
.minib{padding:7px 14px;font-size:.82rem;border-radius:999px;background:rgba(10,132,255,.14);color:var(--blue-d);justify-self:start}
.wl{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--hair);font-size:.9rem;line-height:1.9}
.wl:last-of-type{border-bottom:0}
.wl b{color:var(--blue-d);flex:none}
#wlist{margin:6px 0 14px}

/* رسید */
.rcpt{position:relative;overflow:hidden;background:#fff;color:#1a2240;border-radius:22px;border:1px solid #d5dcf2;margin-bottom:14px;text-align:right}
.rwm{position:absolute;width:270px;height:270px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);background-size:cover;filter:grayscale(1);opacity:.045;pointer-events:none}
.rcpt>*:not(.rwm){position:relative}
.rhd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;background:#1f4fd8;color:#fff}
.rbrand{display:flex;align-items:center;gap:10px;min-width:0}
.rbrand img{width:50px;height:50px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px rgba(255,255,255,.7);flex:none}
.rbrand h2{margin:0;font-size:.98rem;font-weight:800;line-height:1.4}
.rcpt .rbrand p{margin:0;font-size:.78rem;color:#fff;opacity:.85}
.rno{background:#fff;color:#1a2240;border-radius:12px;padding:3px 14px;text-align:center;flex:none}
.rno small{display:block;font-size:.66rem;color:#5b6a8c}
.rno b{font-size:1.35rem;line-height:1.4}
.rbd{padding:14px 16px 6px}
.rl{display:flex;align-items:baseline;gap:8px;padding:5px 0;font-size:.9rem}
.rk{color:#5b6a8c;flex:none}
.rdots{flex:1;border-bottom:2px dotted #c3cbe6;transform:translateY(-4px);min-width:12px}
.rv{font-weight:700;text-align:left;max-width:62%}
.rtile{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#e6edff;border-radius:16px;padding:12px 14px;margin:12px 0}
.rtile small{display:block;font-size:.75rem;color:#5b6a8c}
.rtile b{font-size:1.2rem}
.rtile .sub{font-size:.76rem;color:#5b6a8c;margin-top:2px}
.stamp{flex:none;border:2px solid;border-radius:10px;padding:2px 12px;font-weight:800;font-size:.86rem;transform:rotate(-6deg)}
.st-wait{color:#b9770e;border-color:#b9770e}.st-ready{color:#1d8348;border-color:#1d8348}.st-done{color:#6c7280;border-color:#6c7280}
.rcode{border:2px dashed #2a55e0;border-radius:18px;text-align:center;padding:10px 8px;margin:12px 0}
.rcode small{display:block;font-size:.78rem;color:#5b6a8c}
.rcode b{display:block;font-size:2.3rem;line-height:1.4;color:#1f4fd8;letter-spacing:3px}
.rtear{border-top:2px dashed #c3cbe6;margin:14px 0 12px}
.rwt{font-weight:800;font-size:1rem;margin-bottom:4px}
.rw{display:flex;gap:8px;font-size:.8rem;line-height:1.85;padding:2px 0}
.rw b{color:#1f4fd8;flex:none}
.rok{margin:10px 0 12px;padding:8px 12px;border-radius:12px;background:#e3f6ea;color:#14683a;font-size:.8rem;font-weight:700;line-height:1.8}
.rft{background:#0d2a7a;color:#fff;text-align:center;padding:14px 12px;margin-top:10px}
.rft b{display:block;font-size:1.05rem}
.rft span{display:block;font-size:.8rem;opacity:.9;line-height:1.9}


/* ردیف مشتری */
.crow{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:8px 14px;border-radius:20px;margin-bottom:8px;color:var(--ink)}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.1rem}
.av.wait{background:rgba(255,159,10,.2);color:var(--wait)}
.av.ready{background:rgba(48,209,88,.22);color:var(--ready)}
.av.done{background:rgba(142,142,147,.22);color:var(--done)}
.av.late{background:rgba(255,69,58,.18);color:var(--bad)}
.ctx{flex:1;min-width:0}
.ctx b{display:block;line-height:1.6;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx small{color:var(--mute);font-size:.78rem}
.cdot{width:9px;height:9px;border-radius:50%;flex:none}
.d-x{background:#9aa0ad}
.cchev{color:var(--mute);font-size:1.4rem;flex:none;line-height:1}
.back{display:flex;align-items:center;gap:2px;color:var(--blue-d);font-weight:700;padding:8px 4px;margin-top:4px}
.back .ic{transform:rotate(180deg)}

/* زنگوله */
.bdot{position:absolute;top:9px;right:10px;width:11px;height:11px;border-radius:50%;background:#ff453a;border:2px solid var(--glass-hi)}
.pop{position:absolute;top:calc(100% - 2px);left:16px;width:min(330px,calc(100vw - 32px));border-radius:22px;padding:8px;z-index:12;background:var(--pop)}
.pop .it{line-height:1.5;display:flex;gap:10px;align-items:center;width:100%;text-align:right;padding:9px 10px;border-radius:14px;font-size:.88rem;color:var(--ink)}
.pop .it .ib{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none}
.pop .it .ib .ic{width:20px;height:20px}
.pop .it small{display:block;color:var(--mute);font-size:.76rem}
.pop .none{padding:14px;color:var(--mute);text-align:center;font-size:.85rem}

/* برگه‌ها */
.sheetbg{position:fixed;inset:0;z-index:26;display:none;align-items:flex-end;background:rgba(10,20,50,.38)}
.sheetbg.open{display:flex}
#fsheet{z-index:25}
.sbox{width:100%;max-width:640px;margin:0 auto;border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));background:var(--glass-hi);max-height:92vh;overflow-y:auto;animation:up .25s ease-out;-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid var(--edge)}
.fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.fhead h3{margin:0;font-size:1.2rem;font-weight:800}
.fhead .rb{width:38px;height:38px}
.sbox h3{margin:0 0 6px;font-size:1.15rem}
.sbox p{margin:0 0 14px;color:var(--mute)}
.sbox ol{margin:0 0 16px;padding-inline-start:20px;line-height:2}
#vimg{width:100%;max-height:60vh;object-fit:contain;border-radius:16px;display:block;margin-bottom:14px;background:var(--fill)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.danger{background:rgba(255,69,58,.15);color:var(--bad)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

#lock{position:fixed;inset:0;display:none;place-items:center;z-index:30;padding:16px;
  background:rgba(230,239,255,.55);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
html[data-theme="dark"] #lock{background:rgba(11,18,38,.6)}
#lock form{width:100%;max-width:320px;text-align:center}
#lock .logo{margin:0 auto 4px;width:72px;height:72px}
#lock input{text-align:center;letter-spacing:6px}

#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;
  padding:10px 18px;border-radius:999px;font-size:.88rem;font-weight:600;display:none;max-width:92vw;text-align:center}
#toast.on{display:block}

@media (max-width:360px){.row{grid-template-columns:1fr}.grid4{gap:6px}.tile{font-size:.72rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body::before{display:none}body{padding:0!important}
  body>*:not(#rsheet){display:none!important}
  #rsheet{display:block!important;position:static;background:none}
  #rsheet .sbox{box-shadow:none;border:0;background:none;max-height:none;overflow:visible;padding:0;animation:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .rbtns{display:none!important}
  .rcpt,.rcpt *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

function g2j(gy, gm, gd) {

  jy += 33 * (~~(days / 12053)); days %= 12053;
  jy += 4 * (~~(days / 1461)); days %= 1461;
  if (days > 365) { jy += ~~((days - 1) / 365); days = (days - 1) % 365; }
  var jm = (days < 186) ? 1 + ~~(days / 31) : 7 + ~~((days - 186) / 30);

}
function j2g(jy, jm, jd) {

  var days = (365 * jy) + ((~~(jy / 33)) * 8) + (~~(((jy % 33) + 3) / 4)) + 78 + jd + ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
  gy += 400 * (~~(days / 146097)); days %= 146097;
  if (days > 36524) { gy += 100 * (~~(--days / 36524)); days %= 36524; if (days >= 365) days++; }
  gy += 4 * (~~(days / 1461)); days %= 1461;
  if (days > 365) { gy += ~~((days - 1) / 365); days = (days - 1) % 365; }
  var gd = days + 1;
  var sa = [0,31,((gy % 4 == 0 && gy % 100 != 0) || (gy % 400 == 0)) ? 29 : 28,31,30,31,30,31,31,30,31,30,31];
  var gm; for (gm = 0; gm < 13; gm++) { var v = sa[gm]; if (gd <= v) break; gd -= v; }
  return [gy, gm, gd];
}
function jOf(ts) { var d = new Date(ts); return g2j(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
function opt(v, t, sel) { var o = el('option', '', t); o.value = v; if (sel) o.selected = true; return o; }

var db = null;
function openDB() {
  return new Promise(function (res) {
    try {
      var r = indexedDB.open('repair-photos', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('p'); };
      r.onsuccess = function () { db = r.result; res(); };
      r.onerror = function () { res(); };
    } catch (e) { res(); }
  });
}
function tx(mode, fn) {
  return new Promise(function (res) {
    if (!db) return res(null);
    try {
      var t = db.transaction('p', mode), out = fn(t.objectStore('p'));
      t.oncomplete = function () { res(out && ('result' in out) ? out.result : true); };
      t.onerror = t.onabort = function () { res(null); };
    } catch (e) { res(null); }
  });
}
function putPhoto(id, url) { return tx('readwrite', function (s) { return s.put(url, String(id)); }); }
function getPhoto(id) { return tx('readonly', function (s) { return s.get(String(id)); }); }
function delPhoto(id) { return tx('readwrite', function (s) { return s.delete(String(id)); }); }
function clearPhotos() { return tx('readwrite', function (s) { return s.clear(); }); }
function allPhotos() {
  return new Promise(function (res) {
    var out = {};
    if (!db) return res(out);
    try {
      var r = db.transaction('p', 'readonly').objectStore('p').openCursor();
      r.onsuccess = function () {
        var c = r.result;
        if (c) { out[c.key] = c.value; c.continue(); } else res(out);
      };
      r.onerror = function () { res(out); };
    } catch (e) { res(out); }
  });
}
function compress(file) {
  return new Promise(function (res, rej) {
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function () {
      var s = Math.min(1, 900 / Math.max(img.width, img.height));
      var cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(u);
      res(cv.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = function () { URL.revokeObjectURL(u); rej(); };
    img.src = u;
  });
}

  var due = getDue();
  if (due === null) { toast('تاریخ تحویل کامل یا معتبر نیست'); return; }
  var fields = {
    name: v('name'), phone: v('phone'), model: v('model'), issue: v('issue'),
    cost: v('cost'), adv: v('adv'), war: v('war'), parts: v('parts'), pcost: v('pcost'),
    due: due, status: v('status')
  };
  var id = $('eid').value, isNew = !id;

      Object.keys(fields).forEach(function (k) { c[k] = fields[k]; });

      if (c.status !== 'done') c.doneAt = null;

      if (!$('okc').checked) c.ok = null;

  } else {
    var rec = {id: Date.now(), no: nextNo(), code: newCode(), ok: $('okc').checked ? Date.now() : null, doneAt: fields.status === 'done' ? Date.now() : null};
    Object.keys(fields).forEach(function (k) { rec[k] = fields[k]; });

  }

  closeForm();
  render();

  var r = new FileReader();
  r.onload = function () {
    try {
      var obj = JSON.parse(r.result);
      var arr = Array.isArray(obj) ? obj : obj.customers;
      var photos = Array.isArray(obj) ? {} : (obj.photos || {});
      if (!Array.isArray(arr)) throw 0;
      if (confirm('اطلاعات فعلی با فایل پشتیبان جایگزین شود؟')) {
        data = arr; load(); save();
        var ids = Object.keys(photos);
        clearPhotos().then(function () {
          return Promise.all(ids.map(function (k) { return putPhoto(k, photos[k]); }));
        }).then(function () {
          data.forEach(function (c) { if (photos[String(c.id)]) c.photo = true; });
          save(); render(); toast('پشتیبان بازیابی شد');
        });
      }
    } catch (err) { alert('فایل پشتیبان معتبر نیست.'); }
  };
  r.readAsText(f);
  e.target.value = '';
};

      'دکمه اشتراک‌گذاری (مربع با فلش رو به بالا) را بزن',
      'گزینه «افزودن به صفحه اصلی» (Add to Home Screen) را انتخاب کن',
      'روی «افزودن» بزن'
    ]);
  } else {
    openSheet('اگر دکمه نصب خودکار باز نشد، از منوی مرورگر نصب کن:', [
      'منوی سه‌نقطه بالای مرورگر را باز کن',
      'گزینه «نصب برنامه» یا «افزودن به صفحه اصلی» را بزن'
    ]);
  }
};

function netState() { $('net').hidden = navigator.onLine; }
window.addEventListener('online', netState);
window.addEventListener('offline', netState);
netState();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (hadController) toast('نسخه جدید برنامه آماده شد؛ صفحه را یک‌بار ببند و باز کن');
    else toast('برنامه آماده کار آفلاین است');
    hadController = true;
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}

buildDateSelects();
buildQuick();
load();
save();
applyTheme();
applyHide();
updateToday();
show('home');
render();
openDB().then(function () { render(); });
lockIfNeeded();
setInterval(updateToday, 60000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) { updateToday(); renderHome(); } });
if (/[?&]new=1/.test(location.search)) openForm();
</script>
</body>
</html>
